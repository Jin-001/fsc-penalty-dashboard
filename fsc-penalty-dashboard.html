;
const typeLabel={aml:'防制洗錢／資恐',employee:'員工不法／內控缺失',privacy:'個人資料保護',capital:'資本適足／財務健全',governance:'公司治理／內控制度',banking:'銀行業務／法令遵循',securities:'證券期貨市場／投資管理',insurance:'保險業務／法令遵循',inspection:'金融檢查／監理缺失',other:'其他金融監理案件'};
const $=id=>document.getElementById(id), fields=['year','unit','entity','type','amount'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amountText=n=>n?`NT$ ${(n/10000).toLocaleString('zh-TW',{maximumFractionDigits:2})} 萬`:'—';
function options(id, values, label=x=>x){const el=$(id); [...new Set(values)].sort((a,b)=>String(a).localeCompare(String(b),'zh-Hant')).forEach(v=>el.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(label(v))}</option>`))}
options('year',CASES.map(x=>x.year),(x=>`${x} 年`));options('unit',CASES.map(x=>x.unit));options('entity',CASES.map(x=>x.entity));options('type',CASES.map(x=>x.caseType),x=>typeLabel[x]);
function grouped(data,key){return [...data.reduce((m,x)=>m.set(key(x),(m.get(key(x))||0)+1),new Map())].sort((a,b)=>a[0]>b[0]?1:-1)}
function chart(id,pairs,color){const svg=$(id), w=Math.max(300,svg.clientWidth||500), h=250, pad={l:42,r:12,t:12,b:60}, max=Math.max(...pairs.map(x=>x[1]),1), iw=w-pad.l-pad.r, ih=h-pad.t-pad.b, bar=iw/Math.max(pairs.length,1)*.68;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=`<title>${svg.getAttribute('aria-label')}</title><line x1="${pad.l}" y1="${pad.t+ih}" x2="${w-pad.r}" y2="${pad.t+ih}" stroke="#b9c7d6"/>`+pairs.map(([n,v],i)=>{let x=pad.l+i*iw/pairs.length+(iw/pairs.length-bar)/2, bh=v/max*ih,y=pad.t+ih-bh,label=String(n).replace('局','局');return `<rect x="${x}" y="${y}" width="${bar}" height="${bh}" rx="3" fill="${color}"><title>${esc(label)}：${v} 件</title></rect><text x="${x+bar/2}" y="${y-5}" text-anchor="middle" font-size="12" fill="#16243a">${v}</text><text x="${x+bar/2}" y="${pad.t+ih+16}" text-anchor="end" transform="rotate(-38 ${x+bar/2} ${pad.t+ih+16})" font-size="11" fill="#5d6b7e">${esc(label)}</text>`}).join('')}
function render(){const f=Object.fromEntries(fields.map(k=>[k,$(k).value]));const data=CASES.filter(x=>(!f.year||x.year==f.year)&&(!f.unit||x.unit===f.unit)&&(!f.entity||x.entity===f.entity)&&(!f.type||x.caseType===f.type)&&(!f.amount||Number(x.amount)>=Number(f.amount)));$('count').textContent=data.length.toLocaleString();$('totalAmount').textContent=amountText(data.reduce((sum,x)=>sum+Number(x.amount||0),0));$('entities').textContent=new Set(data.map(x=>x.entity)).size.toLocaleString();$('latest').textContent=data[0]?.date||'–';$('shown').textContent=`顯示 ${data.length} 筆`;
chart('yearChart',grouped(data,x=>x.year),'#1769aa');chart('unitChart',grouped(data,x=>x.unit),'#048a81');$('rows').innerHTML=data.map(x=>`<tr><td>${x.date}</td><td>${x.year}</td><td>${esc(x.unit)}</td><td>${esc(x.entity)}</td><td><span class="tag">${typeLabel[x.caseType]}</span></td><td>${amountText(x.amount)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td></tr>`).join('')||'<tr><td colspan="7">沒有符合條件的案件。</td></tr>'}
fields.forEach(k=>$(k).addEventListener('change',render));
window.addEventListener('resize',render);render();
</script></body></html>
