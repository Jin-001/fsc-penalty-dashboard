name: Refresh FSC penalty dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current FSC penalty cases
        shell: pwsh
        run: ./scripts/refresh-dashboard.ps1
      - name: Commit updated dashboard
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fsc-penalty-dashboard.html
          git commit -m "Update FSC penalty cases"
          git push
